[workspace]
resolver = "3"
members = ["crates/proxy-core", "crates/proxy-cli"]

# Versions are declared once here; member crates opt in with
# `dep = { workspace = true }` so they can never drift apart.
[workspace.dependencies]
proxy-core = { path = "crates/proxy-core" }

hudsucker = "=0.24.1"
http-body-util = "0.1.4"
reqwest = "0.12"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.35"
tracing-subscriber = "0.3"
ratatui = "0.29"

[workspace.package]
version = "0.1.0"
edition = "2024"
