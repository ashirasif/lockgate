[workspace]
resolver = "3"
members = ["crates/proxy-core", "crates/proxy-cli", "crates/proxy-mcp"]

# Versions are declared once here; member crates opt in with
# `dep = { workspace = true }` so they can never drift apart.
[workspace.dependencies]
proxy-core = { path = "crates/proxy-core" }

hudsucker = "=0.24.1"
http-body-util = "0.1.4"
reqwest = "0.12"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.35"
tracing-subscriber = "0.3"
ratatui = "0.30"
# `bundled` compiles SQLite from source: no system libsqlite3 to depend on,
# and the version is pinned by cargo rather than by whatever the OS ships.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
regex = "1"
# Only for rendering capture times in the local zone. `clock` is the feature
# that reads the system zone; the default feature set drags in serde and
# wasm shims we have no use for.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
# Symbols are ~4.5MB of a 20MB binary and buy nothing here: a release build is
# something an operator runs, not something anyone debugs. Backtraces still
# name the crate and are recoverable by building without this.
strip = true
