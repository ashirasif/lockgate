[workspace]
resolver = "3"
members = ["crates/proxy-core", "crates/proxy-cli", "crates/proxy-mcp"]

# Versions are declared once here; member crates opt in with
# `dep = { workspace = true }` so they can never drift apart.
[workspace.dependencies]
proxy-core = { path = "crates/proxy-core" }

hudsucker = "=0.24.1"
http-body-util = "0.1.4"
reqwest = "0.12"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.35"
tracing-subscriber = "0.3"
ratatui = "0.30"
# Body highlighting. `regex-fancy` rather than the default `regex-onig`: onig is
# a C library behind a `cc` build, and fancy-regex is pure Rust for the same
# job. two-face carries bat's larger syntax set as pre-built binary dumps —
# which is also how the unmaintained `yaml-rust` stays out of the tree, since
# nothing parses .sublime-syntax at runtime.
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
# `bundled` compiles SQLite from source: no system libsqlite3 to depend on,
# and the version is pinned by cargo rather than by whatever the OS ships.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
# Content-Encoding. Both pure Rust: flate2 defaults to the miniz_oxide backend,
# and brotli has no C either — worth checking, since a proxy that needs a C
# toolchain to read a gzipped body is a poor trade.
flate2 = "1"
brotli = "8"
regex = "1"
# Only for rendering capture times in the local zone. `clock` is the feature
# that reads the system zone; the default feature set drags in serde and
# wasm shims we have no use for.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.release]
# Symbols are ~4.5MB of a 20MB binary and buy nothing here: a release build is
# something an operator runs, not something anyone debugs. Backtraces still
# name the crate and are recoverable by building without this.
strip = true
