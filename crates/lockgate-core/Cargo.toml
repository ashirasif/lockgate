[package]
name = "lockgate-core"
version.workspace = true
edition.workspace = true

# Note what is NOT here: no ratatui, no UI anything. The seam is now enforced
# by cargo, not by discipline.
[dependencies]
hudsucker = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
regex = { workspace = true }

# Integration tests read the database back with their own connection.
[dev-dependencies]
# WebSocket client for the capture tests. The proxy speaks this via hudsucker.
tokio-tungstenite = "0.24"
futures = "0.3"
rusqlite = { workspace = true }
tokio = { workspace = true }
