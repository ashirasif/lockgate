[package]
name = "proxy-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
proxy-core = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# Pinned exactly, like hudsucker: the MCP wire format and the derive macros move
# together, so a patch bump is not something to take implicitly.
rmcp = { version = "=2.2.0", features = [
    "server",
    "macros",
    "schemars",
    "transport-streamable-http-server",
    "transport-streamable-http-server-session",
] }
# Serves rmcp's tower service over HTTP. The MCP client talks to a URL, not a
# command, because the TUI owns this process's stdio (see the crate docs).
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[dev-dependencies]
# Tests build `CapturedRequest`/`CapturedResponse`, whose fields are `http`
# types re-exported by hudsucker (the same version proxy-core captures with).
hudsucker = { workspace = true }
